<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>口播录音室</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;background:#111716;color:#edf2ec}*{box-sizing:border-box}body{margin:0 auto;max-width:1440px;padding:32px}.muted{color:#a9b6ac}main{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:24px}.panel{background:#1b2420;border:1px solid #344138;border-radius:18px;padding:22px}.tools{display:flex;gap:16px;align-items:center;flex-wrap:wrap;font-size:13px}label{display:grid;gap:8px}input[type=range]{accent-color:#c6e7a5;width:130px}select,button{font:inherit;border-radius:9px;border:1px solid #53614e;padding:10px 14px;background:#27332b;color:inherit}button{cursor:pointer}button:hover{background:#354632}button:disabled{opacity:.4;cursor:default}.primary{background:#c6e7a5;color:#182116;border-color:#c6e7a5}.primary:hover{background:#daf6bf}.danger{background:#673d36;border-color:#a96959}#script{height:59vh;overflow:auto;white-space:pre-wrap;font-size:32px;line-height:1.9;padding:30px 10px 140px;scroll-behavior:auto}#script:focus{outline:1px solid #c6e7a5}.controls{display:flex;gap:10px;flex-wrap:wrap;padding-top:20px;border-top:1px solid #344138}.clock{font-size:46px;font-variant-numeric:tabular-nums;margin:20px 0 8px}meter{width:100%;height:18px}#message{margin-top:20px;line-height:1.6;overflow-wrap:anywhere}aside h2{font-size:16px;font-weight:550}.take{border-top:1px solid #344138;padding:16px 0;display:grid;gap:10px}.take button{text-align:left}audio{width:100%;margin:16px 0}#finish{width:100%;margin-top:15px}#fallback{display:none;color:#c6e7a5}footer{font-size:12px;color:#a9b6ac;margin-top:24px;line-height:1.8}@media(max-width:850px){body{padding:16px}main{grid-template-columns:1fr}#script{height:48vh}}
</style></head>
<body>
<main><section class="panel"><div class="tools"><label>字号<input id="font" type="range" min="20" max="60" value="32"></label><label>滚动速度<input id="speed" type="range" min="5" max="80" value="24"></label><button id="scroll">开始滚动</button><button id="top">回到开头</button></div><div id="script" tabindex="0" aria-label="口播稿"></div><div class="controls"><button id="record" class="primary" disabled>开始录音</button><button id="pause" disabled>暂停</button><button id="stop" class="danger" disabled>停止并保存</button></div></section>
<aside><section class="panel"><h2>录音控制</h2><label>麦克风<select id="mic"><option value="">系统默认麦克风</option></select></label><div id="timer" class="clock" aria-label="录音时长">00:00</div><label class="muted">输入音量<meter id="level" min="0" max="1" low="0.03" high="0.85" optimum="0.3" value="0"></meter></label><div id="message" role="status" aria-live="polite">正在读取口播稿…</div><a id="fallback" download>下载本次原始录音备份</a></section><section class="panel" style="margin-top:20px"><h2>录音版本</h2><div id="takes"></div><audio id="player" controls></audio><button id="finish" class="primary" disabled>使用选中版本，交给 Codex</button></section></aside></main>
<footer>录音每隔约 2 秒保存一块。首次录音请允许浏览器使用麦克风。完成前请保持此页和本地服务开启。<br>交给 Codex 后，在聊天中说“录好了，继续处理”。</footer>
<script src="/recorder.js"></script></body></html>
