<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>口播录音室</title>
<style>
:root{color-scheme:light;font-family:system-ui,-apple-system,sans-serif;background:#f3f0e9;color:#30332f;--line:#d7d8ce;--accent:#3e6154}*{box-sizing:border-box}body{margin:0}button,select{font:inherit;color:inherit;background:transparent;border:1px solid var(--line);border-radius:10px;padding:11px 16px}button{cursor:pointer}button:hover{background:#e7e7dd}button:disabled{opacity:.4;cursor:default}button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:4px}.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.primary:hover{background:#304c42}.danger{color:#954439}.muted{color:#686d63}.menu-button{position:fixed;top:20px;right:24px;width:46px;height:46px;font-size:23px;background:#f3f0e9;z-index:1}main{height:100dvh;display:flex;flex-direction:column;max-width:980px;margin:auto;padding:64px 40px 16px}#script{flex:1;min-height:0;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;font-size:32px;line-height:1.85;letter-spacing:.025em;padding:24px 24px 32vh;scrollbar-width:thin;scrollbar-color:#b8bdb1 transparent}#script:focus-visible{outline:2px solid #9cae9e;outline-offset:3px}.recording-bar{padding:18px 0 0;border-top:1px solid var(--line)}.controls{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap}.clock{font-size:18px;font-variant-numeric:tabular-nums;min-width:56px}meter{width:70px;height:14px}#message{text-align:center;font-size:13px;line-height:1.6;min-height:21px;margin:12px 0 0;overflow-wrap:anywhere}#fallback{display:none;text-align:center;color:var(--accent);margin:8px}dialog{position:fixed;inset:0 0 0 auto;margin:0;width:400px;max-width:100%;height:100dvh;max-height:100dvh;border:0;border-left:1px solid var(--line);background:#faf8f2;color:inherit;padding:26px;overflow-y:auto}dialog::backdrop{background:#30332f30}dialog header{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}h1,h2{font-size:16px;font-weight:600;margin:0}h2{margin:28px 0 16px}label{display:grid;gap:12px;margin:22px 0;font-size:14px}input[type=range]{accent-color:var(--accent);width:100%}select{width:100%}.tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.take{padding:10px 0}.take button{width:100%;text-align:left}audio{width:100%;margin:16px 0}#waveform{height:90px;margin:12px 0}#selection{font-size:12px}#finish{width:100%;margin:20px 0}footer{border-top:1px solid var(--line);padding-top:20px;font-size:12px;line-height:1.8;color:#686d63}@media(max-width:600px){main{padding:66px 16px 12px}#script{padding:12px 8px 32vh}.menu-button{top:12px;right:16px}.controls{gap:8px}button{padding:10px 12px}.controls meter{width:48px}}
</style></head>
<body>
<button id="menu" class="menu-button" aria-label="打开设置与录音版本" aria-haspopup="dialog" aria-controls="settings" aria-expanded="false">☰</button>
<main>
<div id="script" tabindex="0" aria-label="口播稿"></div>
<section class="recording-bar" aria-label="录制控制">
<div class="controls"><span id="timer" class="clock" aria-label="录音时长">00:00</span><meter id="level" aria-label="输入音量" min="0" max="1" low="0.03" high="0.85" optimum="0.3" value="0"></meter><button id="record" class="primary" disabled>开始录音</button><button id="pause" disabled>暂停</button><button id="stop" class="danger" disabled>停止并保存</button><button id="scroll">开始滚动</button></div>
<div id="message" role="status" aria-live="polite">正在读取口播稿…</div><a id="fallback" download>下载本次原始录音备份</a>
</section>
</main>
<dialog id="settings" aria-labelledby="settings-title">
<header><h1 id="settings-title">设置与录音版本</h1><button id="closeMenu" aria-label="关闭菜单">✕</button></header>
<label>字号<input id="font" type="range" min="20" max="60" value="32"></label>
<label>滚动速度<input id="speed" type="range" min="5" max="80" value="24"></label>
<button id="top">回到开头</button>
<label>麦克风<select id="mic"><option value="">系统默认麦克风</option></select></label>
<h2>录音版本</h2><div id="takes"></div><audio id="player" controls></audio><div id="waveform" aria-label="录音波形"></div><div class="tools"><button id="playSelection" disabled>试听选区</button><span id="selection" class="muted">拖动波形选择试听范围</span></div><button id="finish" class="primary" disabled>使用选中版本，交给 Codex</button>
<footer>录音每隔约 2 秒保存。完成前请保持此页和本地服务开启。<br>交给 Codex 后，在聊天中说“录好了，继续处理”。</footer>
</dialog>
<script src="/vendor/wavesurfer.min.js"></script><script src="/vendor/regions.min.js"></script><script src="/recorder.js"></script></body></html>
