<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>口播录音</title>
<link rel="stylesheet" href="/ui.css">
</head>
<body data-state="idle">

<button id="menu" class="icon-btn menu-btn" type="button" aria-label="打开设置与录音版本" aria-haspopup="dialog" aria-controls="settings" aria-expanded="false">
  <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M3 5.5h14M3 10h14M3 14.5h14"/></svg>
  <span id="menuBadge" class="badge" aria-hidden="true" hidden></span>
</button>

<main class="app">
  <div id="script" class="script" tabindex="0" aria-label="口播稿">
    <div id="scriptInner" class="script-inner"><p class="para">正在读取口播稿…</p></div>
  </div>

  <div class="notice-wrap">
    <div id="notice" class="notice" role="status" hidden>
      <span class="notice-ico" aria-hidden="true">
        <svg class="ico-alert" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="9" cy="9" r="7.2"/><path d="M9 5.2v4.6M9 12.6v.1"/></svg>
        <svg class="ico-ok" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 9.5l3.5 3.5 7.5-8"/></svg>
      </span>
      <div class="notice-text"><div id="noticeTitle" class="notice-title"></div><div id="noticeDetail" class="notice-detail"></div></div>
      <div class="notice-actions">
        <a id="fallback" class="btn btn-primary btn-sm" download hidden>
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2.5v8M4.5 7.5L8 11l3.5-3.5M3 13.5h10"/></svg>下载原始录音备份</a>
        <button id="openRecover" class="btn btn-sm" type="button" hidden>打开菜单恢复</button>
        <button id="copyPhrase" class="btn btn-sm" type="button" hidden>复制这句话</button>
        <button id="dismissNotice" class="btn btn-sm btn-quiet" type="button" hidden>关闭</button>
      </div>
    </div>
  </div>

  <section id="bar" class="bar" aria-label="录制控制">
    <div id="progress" class="progress" aria-hidden="true" hidden></div>
    <div class="bar-inner">
      <div class="status">
        <span id="dot" class="dot" aria-hidden="true"></span>
        <span id="timer" class="timer is-dim" aria-label="录音时长">00:00</span>
        <div id="level" class="level" role="img" aria-label="输入电平：未在录音">
          <span class="lv"></span><span class="lv"></span><span class="lv"></span><span class="lv"></span><span class="lv"></span><span class="lv"></span>
          <span class="lv"></span><span class="lv"></span><span class="lv"></span><span class="lv"></span><span class="lv hot"></span><span class="lv hot"></span>
        </div>
        <div class="status-text"><span id="statusLabel" class="status-label">未录制</span><span id="statusMeta" class="status-meta">系统默认麦克风</span></div>
      </div>
      <div class="actions">
        <button id="review" class="btn" type="button" hidden>试听与交接</button>
        <button id="pause" class="btn" type="button" hidden></button>
        <button id="retrySave" class="btn btn-primary" type="button" hidden>重试保存</button>
        <button id="stop" class="btn" type="button" hidden></button>
        <button id="record" class="btn btn-primary" type="button" disabled><span class="recdot" aria-hidden="true"></span><span class="lbl">开始录音</span></button>
      </div>
      <div class="aux">
        <button id="scroll" class="btn btn-quiet scroll-btn" type="button" aria-pressed="false">
          <svg class="ico-down" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2.5v10M4 8.5l4 4 4-4"/></svg>
          <svg class="ico-pause" width="14" height="14" viewBox="0 0 14 14" fill="currentColor" aria-hidden="true"><rect x="2.5" y="2" width="3" height="10" rx="1"/><rect x="8.5" y="2" width="3" height="10" rx="1"/></svg>
          <span class="lbl-long">自动滚动</span><span class="lbl-short">滚动</span><span id="scrollMeta" class="speed-tag">24 px/秒</span>
        </button>
      </div>
    </div>
    <div id="message" class="sr" role="status" aria-live="polite"></div>
  </section>
</main>

<dialog id="settings" class="drawer" aria-labelledby="settings-title">
  <div class="dh">
    <h2 id="settings-title">设置与录音版本</h2>
    <button id="closeMenu" class="icon-btn" type="button" aria-label="关闭菜单">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4.5 4.5l9 9M13.5 4.5l-9 9"/></svg>
    </button>
  </div>
  <div class="db">
    <p id="lock" class="lock" hidden>录音进行中：阅读设置可随时调整；麦克风、试听和交接需要先停止并保存。</p>
    <div class="sec">
      <h3 class="sec-h">阅读</h3>
      <label class="field"><span>字号</span><input id="font" class="range" type="range" min="20" max="60" step="1" value="34"><output id="fontOut" class="field-v" for="font">34 px</output></label>
      <label class="field"><span>滚动速度</span><input id="speed" class="range" type="range" min="5" max="80" step="1" value="24"><output id="speedOut" class="field-v" for="speed">24 px/秒</output></label>
      <div class="row-btns"><button id="top" class="btn btn-sm" type="button">回到开头</button></div>
    </div>
    <div class="sec">
      <h3 class="sec-h"><label for="mic">麦克风</label></h3>
      <div class="select-wrap"><select id="mic" class="select"><option value="">系统默认麦克风</option></select><span class="select-caret" aria-hidden="true"></span></div>
      <p class="hint">录制时请求关闭回声消除、降噪和自动增益，实际设置由浏览器与麦克风决定。</p>
    </div>
    <div class="sec" id="takesSec">
      <h3 class="sec-h">录音版本<small id="takeCount"></small></h3>
      <div id="takes" class="takes"><div class="empty">还没有录音版本。关闭菜单，点击「开始录音」。</div></div>
    </div>
    <div class="sec" id="previewSec" hidden>
      <h3 class="sec-h">试听<small id="previewTitle"></small></h3>
      <audio id="player" class="audio" controls preload="metadata"></audio>
      <div id="waveform" class="wave" aria-label="录音波形，拖动选择试听范围"></div>
      <div class="sel-row">
        <span id="selection" class="sel-txt">在波形上拖动，选择要试听的片段</span>
        <span class="row-btns"><button id="playSelection" class="btn btn-sm" type="button" disabled>试听选区</button></span>
      </div>
    </div>
  </div>
  <div class="df">
    <button id="finish" class="btn btn-primary btn-block" type="button" disabled>使用选中版本，交给 Codex</button>
    <p id="finishNote" class="df-note">交接后，回到 Codex 聊天说「录好了，继续处理」。录音每约 2 秒保存到本地，完成前请保持此页和本地服务开启。</p>
  </div>
</dialog>

<template id="takeTpl">
  <button class="take" type="button" aria-pressed="false"><span class="radio" aria-hidden="true"></span><span><span class="take-t"></span><span class="take-m"></span></span><span class="tag"></span></button>
</template>
<template id="partialTpl">
  <div class="take is-partial"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#7A500E" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="9" r="7"/><path d="M9 5v4.5M9 12.5v.1"/></svg><span><span class="take-t"></span><span class="take-m"></span></span><button class="btn btn-sm" type="button">恢复已保存部分</button><button class="btn btn-sm abandon" type="button">放弃此版本</button></div>
</template>

<script src="/vendor/wavesurfer.min.js"></script>
<script src="/vendor/regions.min.js"></script>
<script src="/ui.js"></script>
<script src="/recorder.js"></script>
</body>
</html>
