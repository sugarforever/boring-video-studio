<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Boring Video · 场景模式库</title><link rel="stylesheet" href="patterns.css"><style>
body{background:#e9e9e5;color:#181818;font:15px/1.5 system-ui,sans-serif}nav{padding:18px 24px;background:#fff;border-bottom:1px solid #ccc;display:flex;align-items:center;gap:14px;flex-wrap:wrap}nav strong{margin-right:auto}button,select,input{padding:8px}#layout{display:grid;grid-template-columns:270px 1fr;min-height:90vh}aside{padding:20px;border-right:1px solid #ccc;background:#f8f8f5}aside button{display:block;width:100%;text-align:left;margin-bottom:6px;background:transparent;border:1px solid transparent;border-radius:5px;cursor:pointer}aside button[aria-pressed=true]{background:#fff;border-color:#aaa}#work{padding:24px;min-width:0}#viewport{width:100%;aspect-ratio:16/9;position:relative;overflow:hidden;box-shadow:0 10px 30px #0002}#stage{transform-origin:top left}#info{max-width:1000px}#info p{margin:10px 0}#props{width:100%;height:160px;font:13px/1.5 monospace}#error{color:#a00;white-space:pre-wrap;overflow-wrap:anywhere}#time{width:220px}a{color:inherit}@media(max-width:850px){#layout{grid-template-columns:1fr}aside{max-height:220px;overflow:auto}#work{padding:12px}}
</style><nav><strong>Boring Video / 场景模式库 · <span id="pattern-count"></span> 类</strong><label>主题 <select id="theme"><option value="blockframe">BlockFrame</option><option value="swiss-minimalism">Swiss Minimalism</option><option value="raycast-dark">Raycast</option><option value="claude-warm">Claude Warm</option></select></label><label>模式 <select id="mode"><option value="light">Light</option><option value="dark">Dark</option></select></label><button id="play">播放</button><button id="restart">重置</button><label>时间 <input type="range" id="time" min="0" max="7.99" step="0.01" value="4"></label><output id="clock">4.00s</output><label>速度 <select id="speed"><option>1</option><option>0.5</option><option>2</option></select></label></nav><div id="layout"><aside><input id="search" placeholder="按用途 / 名称筛选" aria-label="筛选场景"><div id="list"></div></aside><section id="work"><div id="viewport"><div id="stage"></div></div><div id="info"></div><details><summary>修改示例内容 / 复制选择</summary><p>修改 data 中的案例数据，或用 copy 的「原文: 替换文」替换文字。改数据后请同步更新结论与口径。</p><textarea id="props" aria-label="场景 props">{}</textarea><button id="slots">读取当前文字槽</button><button id="validate">校验待用数据</button><button id="apply">确认数据并生成预览</button><button id="copy">复制配置</button><pre id="error"></pre></details><p>案例数据为虚构，插图为原创。当前预览为 16:9 静帧与分步显现；生产需遵循项目 FRAME.md 并接入实际证据和旁白。</p></section></div><script src="catalog.js"></script><script src="themes.js"></script><script src="layouts.js"></script><script src="validation.js"></script><script src="patterns.js"></script><script>
const $=id=>document.getElementById(id);$('pattern-count').textContent=SCENE_CATALOG.length;let id=new URLSearchParams(location.search).get('pattern')||SCENE_CATALOG[0].id;let theme=new URLSearchParams(location.search).get('theme')||'blockframe';let mode=new URLSearchParams(location.search).get('mode')||'light';$('mode').value=mode;let t=4,playing=false,last=0,controller,props=structuredClone(SCENE_CATALOG.find(r=>r.id===id)?.example||{});$('props').value=JSON.stringify(props,null,2);$('theme').value=theme;const previewEnd=SCENE_LIBRARY.preview.duration-.01;$('time').max=previewEnd;
function fit(){$('stage').style.transform=`scale($('viewport').clientWidth/1920)`}new ResizeObserver(fit).observe($('viewport'));
function list(){const q=$('search').value.toLowerCase();$('list').innerHTML='';for(const r of SCENE_CATALOG.filter(r=>(r.title+r.id+r.category+r.question).toLowerCase().includes(q))){const b=document.createElement('button');b.textContent=r.title;b.setAttribute('aria-pressed',r.id===id);b.onclick=()=>{id=r.id;props=structuredClone(r.example);$('props').value=JSON.stringify(props,null,2);t=4;render()};$('list').append(b)}}
function showReport(report){
 $('copy').disabled=true;
 $('error').textContent='需要确认调整；当前保留上次有效预览。\n'+report.issues.map(issue=>{
  const choices=issue.suggestions.map(s=>'  • '+s.label+(s.changes?'：'+JSON.stringify(s.changes):'')).join('\n');
  return issue.path+'：'+issue.message+(issue.actual!==null?'（当前 '+JSON.stringify(issue.actual)+(issue.limit!==null?'；限制 '+JSON.stringify(issue.limit):'')+'）':'')+'\n'+choices;
 }).join('\n');
}
function pending(){try{return JSON.stringify(JSON.parse($('props').value))!==JSON.stringify(props)}catch{return true}}
function render(){try{controller=ScenePatterns.render($('stage'),id,props,{theme,mode,time:t});const r=controller.record;$('info').replaceChildren();for(const text of [r.question,'内容槽：'+r.inputs,'场景建议：'+r.direction,'约束：'+r.constraints]){const p=document.createElement('p');p.textContent=text;$('info').append(p)}$('error').textContent=pending()?'待校验调整；当前画面为上次有效数据。':'';$('copy').disabled=pending();history.replaceState(null,'',`?pattern=${id}&theme=${theme}&mode=${mode}`);list();fit();update()}catch(e){if(e.report)showReport(e.report);else $('error').textContent=e.message}}
function update(){controller?.setTime(t);$('time').value=t;$('clock').textContent=t.toFixed(2)+'s'}
$('mode').onchange=()=>{mode=$('mode').value;render()};$('theme').onchange=()=>{theme=$('theme').value;render()};$('search').oninput=list;$('time').oninput=()=>{t=+$('time').value;playing=false;$('play').textContent='播放';update()};$('play').onclick=()=>{playing=!playing;if(t>=previewEnd)t=0;last=performance.now();$('play').textContent=playing?'暂停':'播放'};$('restart').onclick=()=>{t=0;update()};$('slots').onclick=()=>{try{const draft=JSON.parse($('props').value),copy={...draft.copy};for(const [original,text] of Object.entries(controller.getCopySlots())){if(!/^[\d\s.,%¥℃+/-]+$/.test(original)&&!Object.hasOwn(copy,original))copy[original]=text}$('props').value=JSON.stringify({...draft,copy},null,2);$('copy').disabled=true}catch(e){$('error').textContent=e.message}};$('props').oninput=()=>{$('copy').disabled=true;$('error').textContent='待校验调整；当前画面为上次有效数据。'};
$('validate').onclick=()=>{try{const report=ScenePatterns.validate(id,JSON.parse($('props').value),{theme,mode});if(report.ok)$('error').textContent='校验通过。确认数据后生成预览。';else showReport(report)}catch(e){$('error').textContent=e.message}};
$('apply').onclick=()=>{try{const draft=JSON.parse($('props').value),report=ScenePatterns.validate(id,draft,{theme,mode});if(!report.ok){showReport(report);return}props=draft;render()}catch(e){$('error').textContent=e.message}};$('copy').onclick=async()=>{try{if(pending())throw Error('请先校验并确认待用数据');await navigator.clipboard.writeText(JSON.stringify({id,revision:controller.record.revision,props,theme,mode,...SCENE_LIBRARY.preview},null,2));$('error').textContent='配置已复制'}catch(e){$('error').textContent='复制不可用，请复制 props 和当前场景 ID。'}};
function tick(now){if(playing){t=Math.min(previewEnd,t+(now-last)/1000*Number($('speed').value));update();if(t>=previewEnd){playing=false;$('play').textContent='播放'}}last=now;requestAnimationFrame(tick)}if(!new URLSearchParams(location.search).has('preflight')){render();requestAnimationFrame(tick);}
</script></html>
