<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Boring Video · 场景模式库</title><link rel="stylesheet" href="patterns.css"><style>
body{background:#e9e9e5;color:#181818;font:15px/1.5 system-ui,sans-serif}nav{padding:18px 24px;background:#fff;border-bottom:1px solid #ccc;display:flex;align-items:center;gap:14px;flex-wrap:wrap}nav strong{margin-right:auto}button,select,input{padding:8px}#layout{display:grid;grid-template-columns:270px 1fr;min-height:90vh}aside{padding:20px;border-right:1px solid #ccc;background:#f8f8f5}aside button{display:block;width:100%;text-align:left;margin-bottom:6px;background:transparent;border:1px solid transparent;border-radius:5px;cursor:pointer}aside button[aria-pressed=true]{background:#fff;border-color:#aaa}#work{padding:24px;min-width:0}#viewport{width:100%;aspect-ratio:16/9;position:relative;overflow:hidden;box-shadow:0 10px 30px #0002}#stage{transform-origin:top left}#info{max-width:1000px}#info p{margin:10px 0}#props{width:100%;height:160px;font:13px/1.5 monospace}#error{color:#a00}#time{width:220px}a{color:inherit}@media(max-width:850px){#layout{grid-template-columns:1fr}aside{max-height:220px;overflow:auto}#work{padding:12px}}
</style><nav><strong>Boring Video / 场景模式库 · 20 类</strong><label>主题 <select id="theme"><option value="blockframe">BlockFrame</option><option value="swiss-minimalism">Swiss Minimalism</option><option value="raycast-dark">Raycast Dark</option><option value="claude-warm">Claude Warm</option></select></label><button id="play">播放</button><button id="restart">重置</button><label>时间 <input type="range" id="time" min="0" max="7.99" step="0.01" value="4"></label><output id="clock">4.00s</output><label>速度 <select id="speed"><option>1</option><option>0.5</option><option>2</option></select></label></nav><div id="layout"><aside><input id="search" placeholder="按用途 / 名称筛选" aria-label="筛选场景"><div id="list"></div></aside><section id="work"><div id="viewport"><div id="stage"></div></div><div id="info"></div><details><summary>修改示例内容 / 复制选择</summary><p>填写项目 props；示例数字不构成事实。媒体用本地路径，生产时接入项目素材。</p><textarea id="props" aria-label="场景 props">{}</textarea><button id="apply">应用内容</button><button id="copy">复制配置</button><pre id="error"></pre></details><p>这是可寻址的设计脚手架；主题字体以项目 FRAME.md 为准。案例数据均为虚构，插图为独立绘制；实际证据、旁白与最终剪辑在 HyperFrames 项目中完成。</p></section></div><script src="catalog.js"></script><script src="patterns.js"></script><script>
const $=id=>document.getElementById(id);let id=new URLSearchParams(location.search).get('pattern')||SCENE_CATALOG[0].id;let theme=new URLSearchParams(location.search).get('theme')||'blockframe';let t=4,playing=false,last=0,controller,props=structuredClone(SCENE_CATALOG.find(r=>r.id===id)?.example||{});$('props').value=JSON.stringify(props,null,2);$('theme').value=theme;
function fit(){$('stage').style.transform=`scale($('viewport').clientWidth/1920)`}new ResizeObserver(fit).observe($('viewport'));
function list(){const q=$('search').value.toLowerCase();$('list').innerHTML='';for(const r of SCENE_CATALOG.filter(r=>(r.title+r.id+r.category+r.question).toLowerCase().includes(q))){const b=document.createElement('button');b.textContent=r.title;b.setAttribute('aria-pressed',r.id===id);b.onclick=()=>{id=r.id;props=structuredClone(r.example);$('props').value=JSON.stringify(props,null,2);t=4;render()};$('list').append(b)}}
function render(){try{controller=ScenePatterns.render($('stage'),id,props,{theme,time:t});const r=controller.record;$('info').replaceChildren();for(const text of [r.question,'内容槽：'+r.inputs,'展开顺序：'+r.motion,'约束：'+r.constraints]){const p=document.createElement('p');p.textContent=text;$('info').append(p)}$('error').textContent='';history.replaceState(null,'',`?pattern=${id}&theme=${theme}`);list();fit();update()}catch(e){$('error').textContent=e.message}}
function update(){controller?.setTime(t);$('time').value=t;$('clock').textContent=t.toFixed(2)+'s'}
$('theme').onchange=()=>{theme=$('theme').value;render()};$('search').oninput=list;$('time').oninput=()=>{t=+$('time').value;playing=false;$('play').textContent='播放';update()};$('play').onclick=()=>{playing=!playing;if(t>=7.99)t=0;last=performance.now();$('play').textContent=playing?'暂停':'播放'};$('restart').onclick=()=>{t=0;update()};$('apply').onclick=()=>{try{props=JSON.parse($('props').value);render()}catch(e){$('error').textContent=e.message}};$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(JSON.stringify({id,revision:'2',props,theme,duration:8,ratio:'16:9',background:'opaque'},null,2));$('error').textContent='配置已复制'}catch(e){$('error').textContent='复制不可用，请复制 props 和当前场景 ID。'}};
function tick(now){if(playing){t=Math.min(7.99,t+(now-last)/1000*Number($('speed').value));update();if(t>=7.99){playing=false;$('play').textContent='播放'}}last=now;requestAnimationFrame(tick)}render();requestAnimationFrame(tick);
</script></html>
