<div data-scene="1" style="position:absolute;inset:0;padding:96px 128px 176px;display:flex;flex-direction:column"><div style="display:flex;align-items:center;gap:14px;align-self:flex-start;padding:{{t.kPad}};background:{{t.kBg}};border:{{t.kBd}};border-radius:{{t.kR}};color:{{t.kInk}};font-family:{{t.kF}};font-style:{{t.kSt}};font-weight:{{t.kW}};font-size:26px"><span style="width:{{t.kMW}};height:{{t.kMH}};background:{{t.kMark}};border-radius:{{t.kMR}}"></span>XML · 节点与属性</div><div data-headline="" style="margin-top:20px;font:{{t.dw}} 68px/1.1 {{t.fd}};letter-spacing:{{t.tls}}">顺着嵌套关系，找到目标节点</div><div style="margin-top:30px;flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:48px"><div style="min-width:0;display:flex;flex-direction:column;background:{{t.sf}};border:{{t.bd}};border-radius:{{t.r}};box-shadow:{{t.sh}};overflow:hidden"><div style="height:64px;flex:none;display:flex;align-items:center;gap:18px;padding:0 28px;border-bottom:1px solid {{t.hair}};font-family:{{t.fm}};font-size:24px"><span style="width:12px;height:12px;background:{{t.ac}};border-radius:{{t.dotR}}"></span><span>{{d.code.fileName}}</span><span style="margin-left:auto;color:{{t.mu}}">{{d.code.language}}</span></div><div data-code-source="" style="padding:24px 0;font-family:{{t.fm}};font-size:26px;line-height:42px;color:{{t.ink}}">
